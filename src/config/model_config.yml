model:
  type: lightgbm
  selection_metric: pr_auc
  selected_features: 67

  threshold:
    metric: f1_score
    selection_dataset: validation

  hyperparameters:
    objective: binary
    boosting_type: gbdt
    n_estimators: 950
    learning_rate: 0.02
    num_leaves: 31
    max_depth: -1
    min_child_samples: 50
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 1.0
    scale_pos_weight: computed_from_training_target
    random_state: 42
    n_jobs: -1
