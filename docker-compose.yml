services:

  postgres:

    image: postgres:17

    container_name: mlflow-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mlflow}
      POSTGRES_USER: ${POSTGRES_USER:-mlflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5


  mlflow:

    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow

    container_name: mlflow

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "5000:5000"

    volumes:
      - artifacts_data:/mlflow/artifacts

    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mlflow}
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://localhost:5000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  database-bootstrap:

    image: postgres:17

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_USER: ${POSTGRES_USER:-mlflow}
      AIRFLOW_DATABASE: ${AIRFLOW_DATABASE:-airflow}
      MONITORING_DATABASE: ${MONITORING_DATABASE:-monitoring}

    volumes:
      - ./database/migrations:/migrations:ro

    command: >
      bash -c "
      createdb -h postgres -U $$POSTGRES_USER $$AIRFLOW_DATABASE 2>/dev/null || true;
      createdb -h postgres -U $$POSTGRES_USER $$MONITORING_DATABASE 2>/dev/null || true;
      for migration in /migrations/*.sql; do
        psql -h postgres -U $$POSTGRES_USER -d $$MONITORING_DATABASE -v ON_ERROR_STOP=1 -f $$migration;
      done
      "


  airflow-init:

    build:
      context: .
      dockerfile: docker/Dockerfile.airflow

    depends_on:
      postgres:
        condition: service_healthy
      database-bootstrap:
        condition: service_completed_successfully

    environment: &airflow_environment
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?Set AIRFLOW_FERNET_KEY in .env}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DATABASE:-airflow}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:?Set AIRFLOW_WEBSERVER_SECRET_KEY in .env}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: "60"
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MONITORING_DATABASE_URL: postgresql://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD}@postgres:5432/${MONITORING_DATABASE:-monitoring}
      MONITORING_KEY_SALT: ${MONITORING_KEY_SALT:?Set MONITORING_KEY_SALT in .env}

    volumes: &airflow_volumes
      - ./airflow:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - airflow_logs:/opt/airflow/logs

    command: >
      bash -c "airflow db migrate &&
      (airflow users create
      --username ${AIRFLOW_ADMIN_USERNAME:-admin}
      --password ${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD in .env}
      --firstname ${AIRFLOW_ADMIN_FIRSTNAME:-Credit}
      --lastname ${AIRFLOW_ADMIN_LASTNAME:-Risk}
      --role Admin
      --email ${AIRFLOW_ADMIN_EMAIL:-admin@local.dev}
      || echo 'Airflow admin user already exists.')"


  airflow-webserver:

    build:
      context: .
      dockerfile: docker/Dockerfile.airflow

    depends_on:
      airflow-init:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy

    restart: unless-stopped

    environment: *airflow_environment

    volumes: *airflow_volumes

    ports:
      - "8080:8080"

    command: webserver

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://localhost:8080/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  airflow-scheduler:

    build:
      context: .
      dockerfile: docker/Dockerfile.airflow

    depends_on:
      airflow-init:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy

    restart: unless-stopped

    environment: *airflow_environment

    volumes: *airflow_volumes

    command: scheduler


volumes:

  postgres_data:

  artifacts_data:

  airflow_logs:
