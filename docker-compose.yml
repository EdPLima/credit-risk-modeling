services:

  postgres:

    image: postgres:17

    container_name: mlflow-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mlflow}
      POSTGRES_USER: ${POSTGRES_USER:-mlflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5


  mlflow:

    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow

    container_name: mlflow

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "5000:5000"

    volumes:
      - artifacts_data:/mlflow/artifacts

    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mlflow}
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://localhost:5000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


volumes:

  postgres_data:

  artifacts_data:
