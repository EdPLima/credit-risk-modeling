[project]
name = "credit-risk"
version = "0.1.0"
description = "Reproducible credit risk modelling experiments with MLflow"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ipykernel>=6.29,<7.0",
    "cloudpickle==2.2.1",
    "lightgbm==4.4.0",
    "matplotlib>=3.9,<4.0",
    "mlflow==3.3.2",
    "numpy>=1.26,<2.0",
    "optuna>=4.0,<5.0",
    "optuna-integration[mlflow]>=4.0,<5.0",
    "pandas==2.1.4",
    "psycopg[binary]>=3.2,<3.4",
    "pyarrow==19.0.1",
    "PyYAML>=6.0,<7.0",
    "scikit-learn==1.9.0",
    "scipy>=1.13,<2.0",
    "seaborn>=0.13.2,<0.14.0",
    # SHAP 0.48+ currently resolves an llvmlite build unsupported by Python 3.12.
    "shap>=0.47.2,<0.48.0",
    "xgboost>=2.1,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10.0",
    "ruff>=0.8,<1.0",
]

[tool.uv]
# This repository is an application/notebook project, not a Python package to build.
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
