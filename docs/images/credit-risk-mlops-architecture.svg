<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1350" viewBox="0 0 1600 1350" role="img" aria-labelledby="title description">
  <title id="title">Credit Risk Modeling: end-to-end MLOps architecture</title>
  <desc id="description">Architecture from raw data through model development, MLflow registry, Airflow batch inference, PostgreSQL monitoring, Power BI, and controlled retraining.</desc>
